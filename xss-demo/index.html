<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP 内容安全策略：script-src 'self' 表示只允许同源外部脚本执行，
       禁止所有内联脚本（onerror、onload 等内联事件处理器）。
       这是 XSS 防御的最后一道防线——即使开发者忘了转义，CSP 也能阻止脚本执行 -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <title>Web 安全攻防演练 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>留言板 <span class="badge" id="modeBadge">漏洞模式</span></h1>
    <button id="toggleModeBtn" class="toggle-btn">切换到防御模式</button>
    <p class="tip" id="modeTip">当前为漏洞模式：用户输入未经任何处理直接拼进页面。</p>

    <!-- 模拟一个已登录用户的会话 Cookie，用于演示"偷 Cookie" -->
    <div class="cookie-bar">
      <button id="setCookieBtn">① 设置模拟会话 Cookie</button>
      <span id="cookieStatus">未设置</span>
    </div>

    <form id="msgForm">
      <input type="text" id="nickname" placeholder="昵称" required>
      <textarea id="content" placeholder="留言内容（把攻击载荷粘贴到这里试试）" required></textarea>
      <button type="submit">发布留言</button>
    </form>

    <!-- 攻击载荷快捷填充：点一下自动填入输入框，方便演示 -->
    <div class="payloads">
      <span>常用攻击载荷（点击填入）：</span>
      <button class="payload" data-index="0">篡改页面</button>
      <button class="payload" data-index="1">窃取 Cookie</button>
      <button class="payload" data-index="2">SVG 载荷</button>
    </div>

    <h2>全部留言</h2>
    <button id="clearBtn">清空留言</button>
    <ul id="msgList"></ul>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
